name: Docs

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install docs dependencies
        run: uv sync --group docs

      - name: Configure git for mike
        run: |
          git config user.name "Mohsen Seyedkazemi Ardebili"
          git config user.email "mohsen.seyedkazemi@gmail.com"

      - name: Deploy current version (on push to main / manual dispatch)
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          uv run mike deploy --push --update-aliases "$VERSION" latest

      - name: Deploy version + update latest (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          uv run mike deploy --push --update-aliases "$VERSION" latest

      - name: Set default version to latest
        run: uv run mike set-default --push latest

      # llms.txt is only useful if it sits at a path a crawler will actually try.
      # mike publishes docs under /aobench/<version>/, so docs/llms.txt lands at
      # /aobench/latest/llms.txt and the discoverable /aobench/llms.txt 404s.
      # Copy it to the gh-pages root so both paths resolve.
      - name: Publish llms.txt at the docs root
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/ghp gh-pages
          cp docs/llms.txt /tmp/ghp/llms.txt
          cd /tmp/ghp
          git add llms.txt
          if git diff --cached --quiet; then
            echo "llms.txt unchanged — nothing to publish"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="github-actions[bot]@users.noreply.github.com" \
                commit -m "docs: publish llms.txt at the docs root"
            git push origin gh-pages
          fi
