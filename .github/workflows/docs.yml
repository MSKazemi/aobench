name: Docs

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

# Both the push-to-main and the tag push trigger this workflow, and both deploy to
# gh-pages. Without serialisation they race and one loses ("failed to push some refs").
# Queue them instead of cancelling — a cancelled deploy would leave docs half-published.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        # See ci.yml — setup-uv publishes no major tag beyond v7, so pin the
        # immutable release tag.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install docs dependencies
        run: uv sync --group docs

      - name: Configure git for mike
        run: |
          git config user.name "Mohsen Seyedkazemi Ardebili"
          git config user.email "mohsen.seyedkazemi@gmail.com"

      - name: Deploy current version (on push to main / manual dispatch)
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          uv run mike deploy --push --update-aliases "$VERSION" latest

      - name: Deploy version + update latest (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          uv run mike deploy --push --update-aliases "$VERSION" latest

      - name: Set default version to latest
        run: uv run mike set-default --push latest

      # Discovery files are only useful at a path a crawler will actually try.
      # mike publishes docs under /aobench/<version>/, so anything in docs/ lands at
      # /aobench/latest/<file> while the discoverable /aobench/<file> 404s. Crawlers
      # try the un-versioned path, and robots.txt advertises the un-versioned sitemap
      # URL, so all four are copied to the gh-pages root.
      #
      # Note on robots.txt: a crawler only honours it at the HOST root
      # (https://mskazemi.com/robots.txt, owned by the mskazemi.github.io repo).
      # The copy here is documentation of intent and a correct file should the docs
      # ever be served from their own host — it is not what controls crawling today.
      - name: Publish discovery files at the docs root
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/ghp gh-pages
          cp docs/llms.txt      /tmp/ghp/llms.txt
          cp docs/llms-full.txt /tmp/ghp/llms-full.txt
          cp docs/robots.txt    /tmp/ghp/robots.txt
          # The sitemap is generated, not authored. Take it from the version mike just
          # published so the root copy lists exactly the URLs whose pages carry the
          # matching canonical tag — a sitemap and a canonical that disagree is a worse
          # signal than no sitemap at all.
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ -f "/tmp/ghp/$VERSION/sitemap.xml" ]; then
            cp "/tmp/ghp/$VERSION/sitemap.xml" /tmp/ghp/sitemap.xml
          else
            echo "::warning::no sitemap at /tmp/ghp/$VERSION/sitemap.xml — root sitemap not refreshed"
          fi
          # mike's `set-default` writes a 374-byte JS redirect with <title>Redirecting</title>
          # and no body at the gh-pages root. That path is the canonical URL advertised by
          # pyproject.toml (Homepage/Documentation), the repo homepage field, the README
          # banner, CITATION.cff, codemeta.json, .zenodo.json and the JSON-LD `url` field —
          # and AI crawlers run zero JavaScript, so following the project's own advertised
          # URL yielded nothing. Worse, the stub's <noscript> refresh is `1; url=latest/`,
          # and a DELAYED meta refresh is not treated as a redirect (only `0` is), so the
          # stub was eligible to be indexed on its own as a thin page titled "Redirecting".
          # A 0-delay refresh redirects browsers and crawlers to /latest/ as before, while
          # zero-JS readers get real content and a canonical that agrees with the JSON-LD.
          cat > /tmp/ghp/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>AOBench — benchmark for AI agents that operate HPC systems</title>
          <meta name="description" content="Open-source benchmark for AI agents operating HPC systems: 88 tasks, 29 deterministic snapshots, RBAC-enforced, trace-scored. No cluster needed.">
          <link rel="canonical" href="https://mskazemi.com/aobench/latest/">
          <meta http-equiv="refresh" content="0; url=latest/">
          <script>window.location.replace("latest/" + window.location.search + window.location.hash);</script>
          </head>
          <body>
          <h1>AOBench — Agent Operations Benchmark</h1>
          <p>AOBench is an open-source benchmark for AI agents that operate High-Performance
          Computing systems: 88 tasks across 10 question categories and 5 operator roles, 29
          deterministic environment snapshots — 6 of them rebuilt from real CINECA Marconi100
          ExaData — role-based access control enforced so that a policy violation hard-fails
          the task, and 12 scorers over 7 weighted dimensions. It runs offline, with no
          cluster and no API key.</p>
          <p>Not to be confused with <em>aobench</em>, the ambient-occlusion ray-tracing
          microbenchmark by Syoyo Fujita.</p>
          <ul>
          <li><a href="latest/">Documentation (current release)</a></li>
          <li><a href="latest/leaderboard/">Leaderboard</a></li>
          <li><a href="https://github.com/MSKazemi/aobench">Source on GitHub</a></li>
          </ul>
          </body>
          </html>
          HTML
          git -C /tmp/ghp add llms.txt llms-full.txt robots.txt sitemap.xml index.html
          if git -C /tmp/ghp diff --cached --quiet; then
            echo "discovery files unchanged — nothing new to commit"
          else
            git -C /tmp/ghp \
                -c user.name="github-actions[bot]" \
                -c user.email="github-actions[bot]@users.noreply.github.com" \
                commit -m "docs: publish llms.txt, llms-full.txt, robots.txt, sitemap.xml at the docs root"
          fi
          # Push from the MAIN worktree, never from /tmp/ghp. actions/checkout v6+ no
          # longer writes the token into .git/config; it injects it via
          #   includeIf.gitdir:<repo>/.git.path = $RUNNER_TEMP/git-credentials-*.config
          # and that condition does NOT match a linked worktree's gitdir
          # (<repo>/.git/worktrees/ghp), so a push issued from inside /tmp/ghp is
          # unauthenticated. Refs are shared between worktrees, so the commit made above
          # is pushed from here. Running the push unconditionally also means a broken
          # token fails the run immediately instead of lying dormant until the next time
          # llms.txt happens to change.
          git push origin gh-pages

      - name: Verify the published docs root carries real content
        # `make seo-check` validates the mkdocs output in site/, which never contains the
        # mike/gh-pages root — so no existing gate could see the redirect-stub defect, and
        # it was found only by curling the live URL. This asserts against what is actually
        # served, which is the only place the bug can exist.
        run: |
          # Pages serves the PREVIOUS commit for a while after the push, and it serves it
          # with a perfectly good 200 — so `curl --retry`, which only retries transport
          # errors and 5xx, happily returns the stale page and the assertion fails on
          # content that is already fixed in git. Poll for the new content instead.
          deadline=$(( SECONDS + 300 ))
          while :; do
            body=$(curl -fsS https://mskazemi.com/aobench/ || true)
            size=$(printf '%s' "$body" | wc -c)
            if printf '%s' "$body" | grep -qi 'rel=.\?canonical' \
               && printf '%s' "$body" | grep -qi 'name=.\?description' \
               && [ "$size" -gt 1000 ]; then
              echo "published /aobench/ OK — ${size} bytes, canonical + description present"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::published /aobench/ still looks like a redirect stub after 5 min (${size} bytes)"
              printf '%s\n' "$body" | head -20
              exit 1
            fi
            echo "waiting for Pages to serve the new root (${size} bytes so far)…"
            sleep 20
          done
