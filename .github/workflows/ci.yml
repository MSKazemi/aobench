name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv stopped publishing floating major tags at v8 (supply-chain
        # hardening, see the v8.0.0 release notes) — @v7 is the newest major tag
        # that exists, so pin the immutable release tag instead.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Type check (advisory — full tree)
        # mypy --strict still reports pre-existing debt in 8 of 25 packages, so
        # the full run stays advisory; the ratchet below is the actual gate.
        continue-on-error: true
        run: uv run mypy src/aobench/

      - name: Type debt ratchet
        # Fails only if debt GREW: a package listed in mypy_baseline.json may not
        # exceed its budget, and any package absent from it must stay at zero.
        # Paying debt down also fails, with the one command that records it —
        # see CONTRIBUTING.md, "Type checking".
        run: uv run python scripts/mypy_ratchet.py

      - name: Tests
        run: uv run pytest tests/ -q

      - name: Validate benchmark data
        run: uv run aobench validate benchmark
