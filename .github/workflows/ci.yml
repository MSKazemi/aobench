name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Type check (advisory)
        # mypy runs in --strict mode and currently reports pre-existing type
        # debt across ~29 files. Kept as an advisory signal (annotations still
        # surface) so it does not gate CI while the debt is paid down separately.
        continue-on-error: true
        run: uv run mypy src/aobench/

      - name: Tests
        run: uv run pytest tests/ -q

      - name: Validate benchmark data
        run: uv run aobench validate benchmark
