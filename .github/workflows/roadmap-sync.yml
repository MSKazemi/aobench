name: roadmap-sync

# Regenerates the "Current status" block of ROADMAP.md from GitHub milestones,
# open issues, epic progress and benchmark/BENCHMARK_FACTS.json, and proposes the
# change as a pull request. Never pushes to main; a human merges the PR.
#
# Opening the PR needs Settings → Actions → General → "Allow GitHub Actions to
# create and approve pull requests". While that is off, the job pushes the branch
# and prints a one-click compare link in the run summary instead.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadmap-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the automation/roadmap-sync branch
      pull-requests: write   # open or update its PR
    env:
      BRANCH: automation/roadmap-sync
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Regenerate ROADMAP.md status block (stdlib only)
        run: python3 scripts/gen_roadmap.py --write

      - name: Propose the change
        run: |
          if git diff --quiet -- ROADMAP.md; then
            echo "ROADMAP.md status block already current — nothing to propose." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -q -m "docs(roadmap): sync status block" -- ROADMAP.md
          git push -q --force origin "$BRANCH"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" != "0" ]; then
            echo "Updated the open roadmap-sync PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          body="Automated refresh of the generated **Current status** block in ROADMAP.md (milestones, open issues, epic progress, corpus facts). Generated by \`scripts/gen_roadmap.py\`; hand-written sections are untouched. Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if gh pr create --base main --head "$BRANCH" --title "docs(roadmap): sync status block" --body "$body"; then
            echo "Opened a roadmap-sync PR." >> "$GITHUB_STEP_SUMMARY"
          else
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            echo "::warning::Could not open the PR (Actions may not create PRs in this repo). Open it here: $url"
            echo "Branch pushed. Open the PR: $url" >> "$GITHUB_STEP_SUMMARY"
          fi
