[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aobench"
version = "0.4.1"
description = "AOBench: A Trace-Driven, Role-Aware Benchmark for Agent Operations in Realistic (HPC) Environments"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Mohsen Seyedkazemi Ardebili", email = "mohsen.seyedkazemi@gmail.com" },
]
maintainers = [
    { name = "Mohsen Seyedkazemi Ardebili", email = "mohsen.seyedkazemi@gmail.com" },
]
keywords = [
    "AI agents",
    "agent evaluation",
    "agent benchmark",
    "benchmark",
    "HPC",
    "high-performance computing",
    "LLM evaluation",
    "LLM agents",
    "tool use",
    "RBAC",
    "SLURM",
    "MCP",
    "AIOps",
    "reproducibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.0",
    "paramiko>=4.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
mcp = ["mcp>=1.0", "fastmcp>=2.0", "openai>=1.0"]
langfuse = ["langfuse>=4.0"]
leaderboard = ["fastapi>=0.136.0", "uvicorn>=0.46.0"]
rest = ["fastapi>=0.136.0", "uvicorn>=0.46.0"]
otel = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pingouin>=0.5",
    "krippendorff>=0.6",
    "scipy>=1.12",
    "httpx>=0.28.0",
    "types-pyyaml>=6.0.12.20260518",
    "pandas-stubs>=2.3.3.260113",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.7",
    "mike>=2.1",
    "mkdocs-minify-plugin>=0.8",
    "mkdocs-include-markdown-plugin>=7.1",
    "pillow>=11.0",
    "cairosvg>=2.7",
]

[project.scripts]
aobench = "aobench.cli.main:app"

[project.urls]
Homepage = "https://mskazemi.com/aobench/"
Documentation = "https://mskazemi.com/aobench/"
Repository = "https://github.com/MSKazemi/aobench"
Issues = "https://github.com/MSKazemi/aobench/issues"
Changelog = "https://github.com/MSKazemi/aobench/blob/main/CHANGELOG.md"
"Source mirror" = "https://gitlab.com/mskazemi/aobench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Bundle the benchmark corpus (task specs, environment snapshots, configs) into
# the wheel so `pip install aobench` is self-sufficient. src/aobench/benchmark is
# a symlink to the repo-root benchmark/ directory.
aobench = ["benchmark/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
src = ["src"]
# src/aobench/benchmark is a symlink to the bundled data corpus, not source.
extend-exclude = ["src/aobench/benchmark"]

[tool.mypy]
python_version = "3.10"
strict = true
# src/aobench/benchmark is a symlink to the bundled data corpus, not source.
exclude = ['^src/aobench/benchmark/']

# Optional third-party deps that are not installed in the base environment and
# ship no type stubs — treat as untyped rather than failing the strict gate.
[[tool.mypy.overrides]]
module = [
    "jinja2",
    "jinja2.*",
    "anthropic",
    "anthropic.*",
    "langfuse",
    "langfuse.*",
]
ignore_missing_imports = true

# Installed in the dev environment, but ships no py.typed marker, so mypy reports
# `import-untyped` rather than a missing import. `ignore_missing_imports` does not
# cover that case — it only applies to modules mypy cannot find at all.
#
# pingouin is deliberately NOT listed here. Following into it turns the
# `import-untyped` at its import site into a `no-untyped-call` on
# `pg.intraclass_corr` instead, which is no better and sits on the ICC(A,1) path
# that issue #46 corrected. Left as-is rather than churn that code for a wash.
[[tool.mypy.overrides]]
module = [
    "sklearn",
    "sklearn.*",
]
follow_untyped_imports = true
