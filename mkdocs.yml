site_name: AOBench
site_description: "AOBench: A Trace-Driven, Role-Aware Benchmark for Agent Operations in Realistic Environments"
site_url: https://mskazemi.com/aobench/
repo_url: https://github.com/MSKazemi/aobench
repo_name: MSKazemi/aobench
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tooltips
    - announce.dismiss

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js

plugins:
  - search
  - include-markdown
  - social
  # mike rewrites site_url to <site_url>/<version> during a versioned deploy, which
  # made every /latest/ page canonicalise to /0.4.1/ — so ranking and AI citations
  # accrued to a path that is superseded at the next release. Pinning the canonical
  # version keeps all equity on the evergreen /latest/ URLs that we actually publish.
  - mike:
      canonical_version: latest
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - admonition
  - toc:
      permalink: true
  - md_in_html

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MSKazemi/aobench
      name: AOBench on GitHub
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/mskazemi/aobench
      name: Source mirror on GitLab
    - icon: fontawesome/solid/quote-left
      link: https://doi.org/10.5281/zenodo.21854862
      name: Cite AOBench (DOI)
  # Analytics is intentionally not configured. The previous `G-XXXXXXXXXX`
  # placeholder emitted a broken gtag call on every page. Set a real property
  # here (or delete this comment) when one exists.

